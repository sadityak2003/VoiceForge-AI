server:
  port: ${PORT}

spring:
  config:
    import: optional:file:.env[.properties]
  import: optional:file:.env[.properties]
  application:
    name: voice-service

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: true
    ip-address: 127.0.0.1
    instance-id: ${spring.application.name}:${server.port}

  client:
    service-url:
      defaultZone: ${EUREKA_URL}

elevenlabs:
  api-key: ${ELEVENLABS_API_KEY}
  base-url: ${BASE_URL}

springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

services:
  user:
    url: ${USER_SERVICE}

  history:
    url: ${HISTORY_SERVICE}